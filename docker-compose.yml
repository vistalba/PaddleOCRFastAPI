services:

  PaddleOCR:
    build:
      context: .
      args:
        OCR_MODEL_TIER: small
        INSTALL_AI: false
    container_name: paddle_ocr_api # Custom container name
    image: paddleocrfastapi:latest # Custom image name and tag
    environment:
      - TZ=Asia/Hong_Kong
      - OCR_MODEL_TIER=small
      - OCR_DEVICE=cpu
      - OCR_MODEL_DIR=/app/.paddlex/official_models
      - PADDLE_PDX_CACHE_HOME=/app/.paddlex
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
      - PADDLE_PDX_MODEL_SOURCE=bos
      - PADDLE_PDX_ENABLE_MKLDNN_BYDEFAULT=0
      # Change build.args.INSTALL_AI to true and mount GGUF, then uncomment the following two lines.
      # - AI_TEXT_MODEL_PATH=/app/local_models/Qwen3-0.6B-Q8_0.gguf
      # - AI_TEXT_ORGANIZER_MODE=compare
      # - AI_TEXT_MODEL_THREADS=4
      # - TEXT_RULE_FONT_HEIGHT_RATIO=1.55
      # - TEXT_RULE_TITLE_BODY_HEIGHT_RATIO=1.18
      # - TEXT_RULE_LINE_STEP_RATIO=2.0
      # - TEXT_RULE_HORIZONTAL_GAP_RATIO=3.0
    # volumes:
    #   - ./local_models:/app/local_models:ro
    ports:
      - "8000:8000" # Custom service exposure port, 8000 is FastAPI default port
    restart: unless-stopped
