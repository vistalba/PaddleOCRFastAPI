services:

  PaddleOCR:
    build:
      context: .
      args:
        OCR_MODEL_TIER: small
        INSTALL_AI: false
    container_name: paddle_ocr_api # 自定义容器名
    image: paddleocrfastapi:latest # 自定义镜像名与标签
    environment:
      - TZ=Asia/Hong_Kong
      - OCR_MODEL_TIER=small
      - OCR_DEVICE=cpu
      - OCR_MODEL_DIR=/app/.paddlex/official_models
      - PADDLE_PDX_CACHE_HOME=/app/.paddlex
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
      - PADDLE_PDX_MODEL_SOURCE=bos
      - PADDLE_PDX_ENABLE_MKLDNN_BYDEFAULT=0
      # 将 build.args.INSTALL_AI 改为 true 并挂载 GGUF 后取消下面两行注释。
      # - AI_TEXT_MODEL_PATH=/app/local_models/Qwen3-0.6B-Q8_0.gguf
      # - AI_TEXT_MODEL_THREADS=4
    # volumes:
    #   - ./local_models:/app/local_models:ro
    ports:
      - "8000:8000" # 自定义服务暴露端口，8000 为 FastAPI 默认端口
    restart: unless-stopped
