[project]
name = "PaddleOCRFastAPI"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135.1",
    "numpy==2.3.4",
    "paddleocr==3.7.0",
    "paddlepaddle==3.3.0; sys_platform != 'win32'",
    "paddlepaddle-gpu==3.3.0; sys_platform == 'win32'",
    "python-multipart>=0.0.22",
    "pyyaml>=6.0.2",
    "requests>=2.32.5",
    "uvicorn>=0.41.0",
    "charset_normalizer>=2.0.0,<3.0.0",
    "chardet>=3.0.2,<4.0.0",
    "sqlalchemy>=2.0",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0",
    "pymysql>=1.1",
    "pypdfium2>=4.30",
    "reportlab>=4.1.0",
    "pypdf>=4.3.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
ai = [
    "llama-cpp-python>=0.3.16",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "paddle-gpu-cu118"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu118/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-gpu-cu118" }
